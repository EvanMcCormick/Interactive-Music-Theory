<div #page class="composer-page" *ngIf="state as s">
  <!--
    First, so it hears it is opening before the parts below go inert. Its backdrop covers the window, and while it is
    open every part of the page is inert: no click and no focus reaches the page behind it.
  -->
  <app-composer-shortcut-sheet [open]="sheetOpen" [fallbackFocus]="scoreHost" (closed)="closeShortcutSheet()"></app-composer-shortcut-sheet>
  <app-composer-convert-prompt
    [request]="editRequest"
    [original]="original"
    [convertRefusal]="convertRefusal"
    [busy]="converting"
    [fallbackFocus]="scoreHost"
    (saveOriginal)="saveOriginal()"
    (convert)="convert()"
    (cancelled)="cancelConvert()"
  ></app-composer-convert-prompt>

  <header #topBar class="top-bar" [attr.inert]="modalOpen ? '' : null">
    <div class="score-info">
      <input
        class="title-input"
        type="text"
        [ngModel]="titleText"
        (ngModelChange)="onTitleChange($event)"
        [readonly]="viewingOriginal"
        aria-label="Score title"
      />
      <span class="dirty-marker" *ngIf="s.isDirty" title="Unsaved changes">●</span>
    </div>

    <div class="transport">
      <button
        class="icon-btn"
        type="button"
        (click)="playPause()"
        [attr.aria-label]="playerState?.isPlaying ? 'Pause' : 'Play'"
        [title]="playerState?.isPlaying ? 'Pause (Space)' : 'Play (Space)'"
      >
        <span *ngIf="!playerState?.isPlaying">▶</span>
        <span *ngIf="playerState?.isPlaying">❚❚</span>
      </button>
      <button class="icon-btn" type="button" (click)="stop()" aria-label="Stop" title="Stop">■</button>

      <!-- In Original it shows the file's tempo and takes no input: the field writes `ScoreDoc.tempo`, and there is no document. -->
      <label class="tempo-field">
        <span>BPM</span>
        <input
          type="number"
          min="20"
          max="400"
          [ngModel]="tempoValue"
          (ngModelChange)="onTempoChange($event)"
          [disabled]="viewingOriginal"
        />
      </label>

      <button class="toggle-btn" type="button" [class.active]="metronomeEnabled" [attr.aria-pressed]="metronomeEnabled" (click)="toggleMetronome()">
        Metronome
      </button>
      <button class="toggle-btn" type="button" [class.active]="countInEnabled" [attr.aria-pressed]="countInEnabled" (click)="toggleCountIn()">
        Count-in
      </button>
      <button
        class="toggle-btn"
        type="button"
        [class.active]="playerState?.isLooping"
        [attr.aria-pressed]="playerState?.isLooping ?? false"
        (click)="toggleLoop()"
      >Loop</button>

      <!--
        The readouts sit beside their labels, not in them, so a slider's name is its label alone, and are aria-hidden
        spans rather than <output>s, which are live regions: the seek readout would be read out every second while
        playing. A screen reader has each value from the slider's own aria-valuetext.
      -->
      <!-- A playback multiplier, labelled apart from the BPM: the viewer called it "Tempo", and it is not the score's tempo. -->
      <div class="slider-group">
        <label class="slider-field">
          <span>Speed</span>
          <input
            type="range"
            [min]="speedRange.min"
            [max]="speedRange.max"
            [step]="speedRange.step"
            [value]="speedPercent"
            [attr.aria-valuetext]="speedPercent + '%'"
            [disabled]="!playerState?.isReadyForPlayback"
            (input)="onSpeedInput($any($event.target).value)"
            (change)="onSpeedChange($any($event.target).value)"
          />
        </label>
        <span class="slider-readout speed-readout" aria-hidden="true">{{ speedPercent }}%</span>
      </div>
      <label class="slider-field">
        <span>Volume</span>
        <input
          type="range"
          min="0"
          max="100"
          [value]="volumePercent"
          [attr.aria-valuetext]="volumePercent + '%'"
          [disabled]="!playerState?.isReadyForPlayback"
          (input)="onVolumeInput($any($event.target).value)"
        />
      </label>
      <!--
        A range, not the viewer's clickable div: the keyboard reaches it and a screen reader names it. An arrow moves it a
        second. A drag moves only the thumb and the readout (`seekDraft`), and the player seeks when it lets go.
      -->
      <div class="slider-group seek-field">
        <label class="slider-field">
          <span class="visually-hidden">Position</span>
          <input
            type="range"
            min="0"
            [max]="playerState?.totalDuration ?? 0"
            step="1000"
            [value]="seekDraft ?? playerState?.timePosition ?? 0"
            [attr.aria-valuetext]="timeReadout"
            [disabled]="!(playerState?.totalDuration)"
            (input)="onSeekInput($any($event.target).value)"
            (change)="onSeekChange($any($event.target).value)"
          />
        </label>
        <span class="slider-readout time-readout" aria-hidden="true">{{ timeReadout }}</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="text-btn" type="button" (click)="undo()" [disabled]="!s.canUndo || viewingOriginal" [title]="undoTitle">Undo</button>
      <button class="text-btn" type="button" (click)="redo()" [disabled]="!s.canRedo || viewingOriginal" [title]="redoTitle">Redo</button>
      <button class="text-btn" type="button" (click)="newScore()" title="Start a new score">New</button>
      <button class="text-btn" type="button" [class.active]="showTexPanel" [attr.aria-pressed]="showTexPanel" (click)="toggleTexPanel()">
        alphaTex
      </button>
      <app-composer-scale-panel
        [modalOpen]="modalOpen"
        (menuOpened)="closePopover()"
        (firstOpened)="onScalePanelOpened()"
        (highlightChange)="highlight = $event"
      ></app-composer-scale-panel>
      <app-composer-library-panel [modalOpen]="modalOpen" (menuOpened)="closePopover()"></app-composer-library-panel>
      <button
        class="text-btn shortcuts-toggle"
        type="button"
        aria-label="Keyboard shortcuts"
        title="Keyboard shortcuts (?)"
        [attr.aria-expanded]="sheetOpen"
        (click)="toggleShortcutSheet()"
      >?</button>
    </div>
  </header>

  <app-composer-palette
    class="palette"
    [attr.inert]="modalOpen ? '' : null"
    [state]="s"
    [popover]="popover"
    (toolPressed)="runTool($event)"
    (popoverClosed)="closePopover()"
    (popoverPressedOutside)="score.ignoreNextPress()"
  ></app-composer-palette>

  <div class="score-column" [attr.inert]="modalOpen ? '' : null">
    <!-- Focusable by script only, for the shortcut sheet to give the focus back to. -->
    <app-composer-score #score tabindex="-1" [highlight]="highlight"></app-composer-score>

    <section #texPanel class="tex-panel" *ngIf="showTexPanel">
      <div class="tex-header">
        <h2 class="panel-heading">alphaTex source</h2>
        <div class="tex-actions">
          <button class="text-btn" type="button" (click)="applyTex()">Apply</button>
          <button class="text-btn" type="button" (click)="revertTex()">Revert</button>
        </div>
      </div>

      <p class="tex-stale" *ngIf="texDraftOutOfDate">{{ texOutOfDate }}</p>

      <textarea class="tex-editor" [(ngModel)]="texDraft" spellcheck="false" aria-label="alphaTex source"></textarea>

      <ul class="diagnostics" *ngIf="texDiagnostics.length > 0">
        <li
          *ngFor="let d of texDiagnostics"
          class="diagnostic"
          [class.error]="d.severity === 'error'"
          [class.warning]="d.severity === 'warning'"
        >
          <span class="location">{{ d.line }}:{{ d.column }}</span>
          <span class="message">{{ d.message }}</span>
        </li>
      </ul>
    </section>
  </div>

  <app-composer-status-line
    #statusLine
    class="status"
    [attr.inert]="modalOpen ? '' : null"
    [refusal]="s.refusal"
    [notice]="s.notice"
    [messageId]="s.messageId"
    [texError]="texApplyError"
    [texErrorId]="texErrorId"
    [cursor]="fileCursor ?? s.cursor"
    [entryMode]="s.entryMode"
    [doc]="s.doc"
    [viewingOriginal]="viewingOriginal"
    [fileBarCount]="fileBarCount"
  ></app-composer-status-line>

  <!-- Its range is the one the strip is clamped to (`stripRange`), measured from the page as it is laid out. -->
  <div
    #stripSeparator
    class="strip-resize"
    [attr.inert]="modalOpen ? '' : null"
    role="separator"
    tabindex="0"
    aria-orientation="horizontal"
    aria-label="Track strip height"
    [attr.aria-valuemin]="stripRange.min"
    [attr.aria-valuemax]="stripRange.max"
    [attr.aria-valuenow]="stripHeight"
    (pointerdown)="onStripResizeStart($event)"
    (pointermove)="onStripResize($event)"
    (pointerup)="onStripResizeEnd()"
    (pointercancel)="onStripResizeEnd()"
    (keydown)="onStripResizeKey($event)"
  ></div>

  <app-composer-track-strip class="strip" [attr.inert]="modalOpen ? '' : null" [style.height.px]="stripHeight"></app-composer-track-strip>
</div>

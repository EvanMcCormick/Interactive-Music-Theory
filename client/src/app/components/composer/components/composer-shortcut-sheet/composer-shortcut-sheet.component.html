<!--
  Behind the sheet and over the whole window, while it is open: a click beside the sheet closes it, as Escape does, and
  reaches nothing on the page under it.
-->
<div class="sheet-backdrop" [class.open]="open" aria-hidden="true" (click)="closed.emit()"></div>

<section
  #sheet
  class="sheet"
  [class.open]="open"
  role="dialog"
  aria-modal="true"
  aria-labelledby="composer-shortcut-sheet-heading"
  [attr.aria-hidden]="!open"
  (keydown)="trapTab($event)"
>
  <header class="sheet-header">
    <h2 #heading id="composer-shortcut-sheet-heading" tabindex="-1">Keyboard shortcuts</h2>
    <button type="button" class="sheet-close" aria-label="Close keyboard shortcuts" (click)="closed.emit()">×</button>
  </header>

  <p class="sheet-note">
    A key written as a symbol - <kbd>?</kbd>, <kbd>&#125;</kbd> - is pressed however your keyboard layout types that
    symbol. Keys are ignored while you type in a field<ng-container *ngIf="textFieldKeys">, except <kbd>{{ textFieldKeys }}</kbd></ng-container>.
  </p>

  <!-- Focusable, so the keyboard can scroll the list. -->
  <div class="sections" tabindex="0" role="region" aria-label="Shortcuts by group">
    <section class="section" *ngFor="let section of sections; trackBy: trackByGroup">
      <h3>{{ section.group }}</h3>
      <dl>
        <ng-container *ngFor="let row of section.rows">
          <dt>{{ row.label }}</dt>
          <dd><kbd>{{ row.keys }}</kbd></dd>
        </ng-container>
      </dl>
    </section>
  </div>
</section>

<div class="piano-roll">
  <div class="toolbar">
    <h3 class="title">Notes</h3>
    <p class="position">{{ positionText }}</p>

    <label class="grid-control">
      <span class="grid-label">Grid</span>
      <!-- The current grid is marked on the option rather than bound as the
           select's own `value`. Angular sets a property binding on this element
           before the `*ngFor` below has created anything to match it, and a
           `<select>` handed a value none of its options carry falls back to the
           first one - so the box would have opened on `Free` while the roll was
           snapping to sixteenths. -->
      <select #divisionSelect class="grid-select" (change)="setDivision(divisionSelect.value)">
        <option
          *ngFor="let option of divisions"
          [value]="option.value"
          [selected]="option.value === division">{{ option.label }}</option>
      </select>
    </label>

    <!-- The keyboard path to creating a note, and the only one there is: the
         double-click surface below is a bare `<div>` that no tab reaches and no
         key answers. Without this a keyboard user can move, resize, re-voice,
         re-velocity and delete a note but never make one, and deleting the last
         note of a slot leaves it uneditable but for Reset to chord - which
         throws away every other edit in the slot. See `addNoteAtStart`.

         `aria-disabled` and not `[disabled]`, on the same argument as Reset to
         chord below and with the same sentence: the two buttons refuse for one
         reason - no chord is selected - and a rule that held on one of two
         adjacent controls would not be a rule. `addNoteAtStart` returns early on
         the same condition, so the button being pressable changes nothing but
         its reachability. -->
    <button
      type="button"
      class="add"
      #addButton
      [class.unavailable]="!hasSlot"
      [attr.aria-disabled]="!hasSlot"
      [attr.aria-describedby]="hasSlot ? null : reasonId"
      [attr.title]="hasSlot ? null : resetReason"
      (click)="addNoteAtStart()">
      Add note
    </button>

    <!-- The escape hatch. Per-aspect ownership is only safe while there is a way
         back: without this, dragging one note opts the slot out of re-voicing
         for good. It is also the way out of a slot that has lost its numeral,
         which is what the chip beside it may be reporting.

         `aria-disabled` and not `[disabled]`, with the handler returning early:
         a `[disabled]` button is out of the tab order, so a user who wants to
         know why the one way back is unavailable has no way to ask. Focusable,
         it answers for itself through `aria-describedby`. That is the pattern a
         sibling review arrived at for the palette's `+`, applied here first
         because this is the control the question gets asked about. -->
    <button
      type="button"
      class="reset"
      #resetButton
      [class.unavailable]="!canReset"
      [attr.aria-disabled]="!canReset"
      [attr.aria-describedby]="canReset ? null : reasonId"
      [attr.title]="resetReason"
      (click)="resetToChord()">
      Reset to chord
    </button>
    <!-- Clipped rather than laid out: the toolbar is a single row beside a grid
         control and a chip, and the sentence is long. It is on the page for
         `aria-describedby` to resolve, and the same words are on the button's
         `title` for a pointer. The id is per instance - see `nextRollId`. -->
    <p class="reset-reason" [id]="reasonId" *ngIf="resetReason">{{ resetReason }}</p>

    <!-- What the app did to this slot's label, and the way back from it.
         Unconditional: the chip's live region only announces a relabel if it was
         on the page before the relabel happened. See the component. -->
    <app-relabel-chip (dismissed)="focusAfterRelabel()"></app-relabel-chip>
  </div>

  <div class="body" *ngIf="hasSlot; else noSlot"
    [style.--roll-beats]="totalBeats"
    [style.--roll-rows]="gridRows"
    [style.--roll-division]="gridDivision">
    <!-- The keyboard. Presentational: every pitch it names is already on the
         label of the note that sounds it, and a screen reader walking 25 rows
         of an editor it cannot play is 25 rows of nothing. -->
    <div class="keys" aria-hidden="true">
      <div
        class="key"
        *ngFor="let row of rows; trackBy: trackByMidi"
        [class.black]="row.isBlack"
        [title]="row.label">
        <span class="key-name" *ngIf="row.showName">{{ row.label }}</span>
      </div>
    </div>

    <div class="scroller">
      <!-- The grid lines are this element's background - three repeating
           gradients, for rows, subdivisions and beats. Drawing them as elements
           is what makes naive rolls stutter; the notes stay elements because
           they are the things that have to be hit-tested. -->
      <!-- A group rather than a list: the double-click surface below is a child
           of this element and is not a note, and a `list` whose children are not
           all `listitem`s is a list a screen reader has to guess about. -->
      <div class="grid" #grid role="group" aria-label="Notes in this chord">
        <!-- The double-click surface sits *under* the notes rather than around
             them, so a double-click on a note reaches the note and never this:
             a note is not a request for a second one on top of it. -->
        <div class="surface" (dblclick)="addNote($event)"></div>

        <div
          class="note"
          *ngFor="let note of notes; trackBy: trackByIndex"
          [style.--note-beat]="note.startBeat"
          [style.--note-beats]="note.lengthBeats"
          [style.--note-row]="note.row"
          (contextmenu)="deleteNote(note, $event)">
          <!-- The body is the drag handle and the focus target at once. -->
          <button
            type="button"
            class="note-body"
            #noteBody
            [attr.aria-label]="note.label"
            (pointerdown)="startMove(note, $event)"
            (keydown.arrowup)="nudgePitch(note, 1, $event)"
            (keydown.arrowdown)="nudgePitch(note, -1, $event)"
            (keydown.arrowright)="nudgeStart(note, 1, $event)"
            (keydown.arrowleft)="nudgeStart(note, -1, $event)"
            (keydown.delete)="deleteNote(note, $event)"
            (keydown.backspace)="deleteNote(note, $event)">
            <span class="note-name">{{ note.name }}</span>
          </button>

          <!-- The right edge. Dragged with a pointer, stepped with the arrow
               keys - a slider rather than a button, because those keys are the
               whole of that path and the length is the value they change.

               A `<div tabindex="0">` rather than a `<button role="slider">`,
               which is what this was: `slider` is not one of the roles ARIA in
               HTML permits on a `<button>` (checkbox, combobox, link, menuitem,
               menuitemcheckbox, menuitemradio, option, radio, switch, tab are),
               so the pair is non-conforming however well it happens to be
               announced. A generic element carries no implicit role to
               contradict, which is the construction the spec expects for a
               widget built out of nothing. The strip's handle is changed with
               it - it had copied this, and one of the two conforming would have
               been worse than either. -->
          <div
            class="note-resize"
            role="slider"
            tabindex="0"
            [attr.aria-label]="note.resizeLabel"
            [attr.aria-valuemin]="minNoteLength"
            [attr.aria-valuemax]="note.maxBeats"
            [attr.aria-valuenow]="note.lengthBeats"
            [attr.aria-valuetext]="note.beatsText"
            (pointerdown)="startResize(note, $event)"
            (keydown.arrowright)="nudgeLength(note, 1, $event)"
            (keydown.arrowleft)="nudgeLength(note, -1, $event)"></div>
        </div>
      </div>

      <!-- One bar per note, side by side under the notes they belong to and
           scrolling with them. `RollNote.velocity` is already on the model, so
           this is a view of the document rather than anything new in it.

           The column is `buildLaneColumns`' and not the note's own beat and
           length, which is what this used to draw: a generated chord gives every
           note `startBeat: 0` and the slot's length, so every bar landed on the
           same rectangle, the lane showed the silhouette of whichever was
           loudest, and a press anywhere in it reached the last note in the list
           and no other. That function states the rule and why no two columns can
           overlap. `role="slider"` on a `<div>` for the reason above. -->
      <div class="lane" #lane>
        <div
          class="velocity"
          role="slider"
          tabindex="0"
          *ngFor="let note of notes; trackBy: trackByIndex"
          [style.--lane-beat]="note.laneBeat"
          [style.--lane-beats]="note.laneBeats"
          [style.--note-velocity]="note.velocityFraction"
          [attr.aria-label]="note.velocityLabel"
          [attr.aria-valuemin]="1"
          [attr.aria-valuemax]="127"
          [attr.aria-valuenow]="note.velocity"
          (pointerdown)="startVelocity(note, $event)"
          (keydown.arrowup)="nudgeVelocity(note, 1, $event)"
          (keydown.arrowdown)="nudgeVelocity(note, -1, $event)"></div>
      </div>
    </div>
  </div>

  <ng-template #noSlot>
    <p class="empty">
      Pick a chord on the strip to draw its notes. Double-click the grid or press
      Add note to add one, drag it to move it, drag its right edge to change how
      long it is.
    </p>
  </ng-template>
</div>

<div class="chord-palette">
  <h3 class="title">Chords in this key</h3>

  <!-- The guard. A pentatonic or blues scale has no thirds to stack, so the
       page says why rather than printing chords it invented.

       The live region is the wrapper and not the paragraph: switching to a
       pentatonic scale *creates* the paragraph, and a region announces changes
       to itself rather than its own arrival, so an aria-live on an element that
       did not exist a moment ago says nothing. The wrapper is always here. -->
  <div class="unavailable-region" aria-live="polite">
    <p class="unavailable" *ngIf="unavailable">{{ unavailable }}</p>
  </div>

  <div class="chords" *ngIf="unavailable === null" role="group" aria-label="Diatonic chords">
    <button
      type="button"
      class="chord"
      *ngFor="let chord of chords; trackBy: trackByDegree"
      [class.tonic]="chord.isTonic"
      [attr.aria-label]="chord.label"
      (click)="addChord(chord)">
      <span class="numeral">{{ chord.numeral }}</span>
      <span class="name">{{ chord.name }}</span>
    </button>
  </div>

  <!-- The three rows the vocabulary derives. Each is hidden when it is empty
       rather than drawn as a heading over nothing: the alternates row has no
       root to sit on until a chord is selected, and a mode can already own
       every chord the borrowed row would offer it.

       The buttons carry `option` and not `chord`, which is what keeps the seven
       above countable: they are the row the panel is titled after, and a spec
       or a stylesheet that means those seven should not have to say "the first
       seven of them".

       `current` is one mark on all three rows and does not mean quite the same
       thing on each. On the alternates it is the shape you are on, and that
       button re-states it; on the two append rows it is a fact about the
       selection - the chord you are on is this borrowed one - and the button
       still adds another. Both are statements about the selected chord, which
       is what `aria-current` says and all it says. -->
  <section
    class="group"
    *ngIf="alternates.length > 0"
    role="group"
    aria-label="Other shapes on the selected chord">
    <h4 class="group-title">Other shapes</h4>
    <div class="options">
      <button
        type="button"
        class="option"
        *ngFor="let option of alternates; trackBy: trackByKey"
        [class.current]="option.current"
        [attr.aria-current]="option.current ? 'true' : null"
        [attr.aria-label]="option.label"
        (click)="chooseAlternate(option)">
        <span class="numeral">{{ option.numeral }}</span>
        <span class="name">{{ option.name }}</span>
        <!-- The height this shape stands on, and an arrow when that is below
             the one the slot is on. The arrow rather than the colour alone is
             the part a user who cannot see the amber gets; the spoken label
             carries the same fact in words. -->
        <span class="height" [class.lowers]="option.lowersHeight">
          <span class="lowers-mark" *ngIf="option.lowersHeight" aria-hidden="true">&darr;</span
          >{{ option.heightLabel }}
        </span>
      </button>
    </div>
    <p class="hint" *ngIf="heightWarning">{{ heightWarning }}</p>
  </section>

  <section class="group" *ngIf="borrowed.length > 0" role="group" aria-label="Borrowed chords">
    <h4 class="group-title">Borrowed</h4>
    <div class="options">
      <button
        type="button"
        class="option"
        *ngFor="let option of borrowed; trackBy: trackByKey"
        [class.current]="option.current"
        [attr.aria-current]="option.current ? 'true' : null"
        [attr.aria-label]="option.label"
        (click)="addOption(option)">
        <span class="numeral">{{ option.numeral }}</span>
        <span class="name">{{ option.name }}</span>
      </button>
    </div>
  </section>

  <section class="group" *ngIf="secondary.length > 0" role="group" aria-label="Secondary dominants">
    <h4 class="group-title">Secondary dominants</h4>
    <div class="options">
      <button
        type="button"
        class="option"
        *ngFor="let option of secondary; trackBy: trackByKey"
        [class.current]="option.current"
        [attr.aria-current]="option.current ? 'true' : null"
        [attr.aria-label]="option.label"
        (click)="addOption(option)">
        <span class="numeral">{{ option.numeral }}</span>
        <span class="name">{{ option.name }}</span>
      </button>
    </div>
  </section>

  <!-- Hidden rather than greyed in a key that can build no chords. They act on
       a selected chord, and there is none to select: the panel would otherwise
       be half grey with the hint that explains grey steppers suppressed, in
       exactly the state this component works hardest to explain. -->
  <div class="controls" *ngIf="unavailable === null">
    <div class="control" role="group" aria-label="Chord complexity">
      <span class="control-label">Complexity</span>
      <button
        type="button"
        class="step"
        aria-label="Simpler chord"
        [disabled]="!canAdjust"
        (click)="stepComplexity(-1)">&minus;</button>
      <span class="control-value">{{ extentLabel }}</span>
      <button
        type="button"
        class="step"
        aria-label="Richer chord"
        [disabled]="!canAdjust"
        (click)="stepComplexity(1)">+</button>
    </div>

    <div class="control" role="group" aria-label="Chord octave">
      <span class="control-label">Octave</span>
      <button
        type="button"
        class="step"
        aria-label="Octave down"
        [disabled]="!canAdjust"
        (click)="stepOctave(-1)">&minus;</button>
      <span class="control-value">{{ octaveLabel }}</span>
      <button
        type="button"
        class="step"
        aria-label="Octave up"
        [disabled]="!canAdjust"
        (click)="stepOctave(1)">+</button>
    </div>
  </div>

  <!-- Why the controls are grey. They act on the selected chord, and appending
       one selects it, so this shows only after the selection is cleared. -->
  <p class="hint" *ngIf="!canAdjust && unavailable === null">
    Pick a chord in the strip to change its complexity or octave.
  </p>
</div>
